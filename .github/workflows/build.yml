name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/splitfinder app/src/main/assets
          cp MainActivity.java app/src/main/java/com/example/splitfinder/
          cp AndroidManifest.xml app/src/main/
          cp shim.js app/src/main/assets/
          cp "$(find . -name scanner.js -not -path './app/*' | head -1)" app/src/main/assets/scanner.js
          cp app-build.gradle app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: train-split-app
          path: app/build/outputs/apk/debug/app-debug.apk
